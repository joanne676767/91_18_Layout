<!DOCTYPE html>
<html>
    <head>
        <title>Table Gabungan</title>
        <style>
            table, th, td {
                border: 1px solid black;
            }
            table {
                width: 60%;
                border-collapse: collapse;
            }
            th {
                height: 40px;
                padding: 2px;
                background-color: beige;
            }
            tr {
                background-color: bisque;
            }
            tr:nth-child(even) {
                background-color: blanchedalmond;
            }
            tr:hover {
                background-color: pink;
            }
        </style>
    </head>
    <body>

</html>
